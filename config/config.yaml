---
# Shared pipeline configuration. Site-specific paths and runtime settings live
# under config/site_configs/. The launcher merges the selected site file and
# expands the {{VARIABLE}} values before Snakemake starts.
SITE_ID: local
HYDRA_LOCAL_PATH: "vendor"
RESOURCES_FILE: "config/resources.yaml"
DEFAULT_CONTAINER: "docker://hydragenetics/common:3.1.1"
REFERENCE_ROOT: "references"
CONTAINER_CACHE: "vendor/containers"

# These defaults keep direct local Snakemake invocations useful. A site config
# may replace any of them with absolute paths on a workstation or cluster.
HG38_FASTA: "references/hg38/GRCh38.fa"
HG38_FAI: "references/hg38/GRCh38.fa.fai"
HG38_DICT: "references/hg38/GRCh38.dict"
HG38_MMI: ""
HG38_DESIGN_BED: "references/hg38/targets.bed"
HG38_SV_ANNOTATION_BED: ""
HG38_TANDEM_REPEATS: ""
HG38_CLINVAR: ""
HG38_CYTOBAND: ""
HG38_GTF: ""
HG38_ANNOTATIONS: ""
HS1_FASTA: "references/hs1/chm13v2.0.fa"
HS1_FAI: "references/hs1/chm13v2.0.fa.fai"
HS1_DICT: "references/hs1/chm13v2.0.dict"
HS1_MMI: ""
HS1_DESIGN_BED: "references/hs1/targets.bed"
HS1_SV_ANNOTATION_BED: ""
HS1_TANDEM_REPEATS: ""
HS1_CLINVAR: ""
HS1_CYTOBAND: ""
HS1_GTF: ""
HS1_ANNOTATIONS: ""
VEP_CACHE: ""
SNPEFF_DB: ""
SIMPLE_SV_PANEL: ""
SIMPLE_SV_FUSION_PAIRS: ""

site: "{{SITE_ID}}"
hydra_local_path: "{{HYDRA_LOCAL_PATH}}"

samples: "config/samples.tsv"
units: "config/units.tsv"
output: "config/output_files.yaml"
resources: "{{RESOURCES_FILE}}"
default_container: "{{DEFAULT_CONTAINER}}"
container_cache: "{{CONTAINER_CACHE}}"
container_runtime: singularity
singularity_binds: []

modules:
  alignment: "v0.8.0"
  annotation: "v1.4.1"
  cnv_sv: "v3.2.1"
  qc: "v0.8.0"
  # Local compatibility tag derived from Hydra snv_indels v2.1.0; see
  # build/patches/snv_indels_v2.1.0_snakemake7.patch.
  snv_indels: "v2.1.0-quicken"

reference_build: "hg38"
references:
  hg38:
    fasta: "{{HG38_FASTA}}"
    fai: "{{HG38_FAI}}"
    dict: "{{HG38_DICT}}"
    mmi: "{{HG38_MMI}}"
    design_bed: "{{HG38_DESIGN_BED}}"
    sv_annotation_bed: "{{HG38_SV_ANNOTATION_BED}}"
    tandem_repeats: "{{HG38_TANDEM_REPEATS}}"
    clinvar: "{{HG38_CLINVAR}}"
    cytoband: "{{HG38_CYTOBAND}}"
    gene_annotation: "{{HG38_GTF}}"
    annotations: "{{HG38_ANNOTATIONS}}"
    chromosomes: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22, chrX, chrY]
    skip_chrs: [chrM]
  hs1:
    fasta: "{{HS1_FASTA}}"
    fai: "{{HS1_FAI}}"
    dict: "{{HS1_DICT}}"
    mmi: "{{HS1_MMI}}"
    design_bed: "{{HS1_DESIGN_BED}}"
    sv_annotation_bed: "{{HS1_SV_ANNOTATION_BED}}"
    tandem_repeats: "{{HS1_TANDEM_REPEATS}}"
    clinvar: "{{HS1_CLINVAR}}"
    cytoband: "{{HS1_CYTOBAND}}"
    gene_annotation: "{{HS1_GTF}}"
    annotations: "{{HS1_ANNOTATIONS}}"
    chromosomes: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22, chrX, chrY]
    skip_chrs: [chrM]

# Passed verbatim to minimap2. Add/remove methylation- or SAM-related flags
# here, for example --MD or -y, according to the basecaller and downstream
# modification workflow. The alignment rule also adds an @RG line by default.
minimap2_align:
  preset: "map-ont"
  extra: "-y -Y --MD"
  read_group: ""
  container: "docker://hydragenetics/minimap2:2.26"

minimap2_index:
  container: "docker://hydragenetics/common:3.1.1"

sniffles2_call:
  container: "docker://hydragenetics/sniffles2:2.2"
  tandem_repeats: ""
  extra: ""

samtools_fastq:
  # -T carries MM/ML tags into FASTQ comments when the input BAM contains
  # them. Set to "-n" if the installed samtools cannot copy these tags.
  extra: "-n -T MM,ML"

mosdepth:
  by: "500"
  container: "docker://hydragenetics/mosdepth:0.3.2"
  extra: "--fast-mode --no-per-base"

mosdepth_bed:
  container: "docker://hydragenetics/mosdepth:0.3.2"
  extra: ""

cramino:
  container: "docker://hydragenetics/common:3.1.1"
  extra: ""

gatk_mutect2:
  container: "docker://hydragenetics/gatk4:4.2.2.0"
  # Mutect2 is retained because it is part of the requested analysis, but
  # its ONT error model and filtering require validation for the intended use.
  extra: ""

gatk_merge_mutect_stats:
  container: "docker://hydragenetics/gatk4:4.2.2.0"
  extra: ""

gatk_filter_mutect_calls:
  container: "docker://hydragenetics/gatk4:4.2.2.0"
  extra: ""

bcftools_norm_mutect2:
  container: "docker://hydragenetics/common:3.1.1"
  extra: "--multiallelics -both --check-ref w"

# VEP is optional because its offline cache must match the selected reference.
# The normalized filtered VCF is used in the report when this is false.
annotate_small_variants_with_vep: false
vep:
  container: "docker://hydragenetics/vep:111.0"
  vep_cache: "{{VEP_CACHE}}"
  skip: false
  mode: "--offline --cache --merged"
  extra: "--assembly GRCh38 --check_existing --pick --variant_class --symbol --hgvs"

quicken_excel_report:
  # The report writer uses only Python's standard library.
  container: "docker://hydragenetics/common:3.1.1"

snpeff:
  container: "docker://hydragenetics/snpeff:5.0"
  db: "{{SNPEFF_DB}}"
  extra: "-nodownload"

simple_sv_annotation:
  container: "docker://hydragenetics/simple_sv_annotation:2019.02.18"
  panel: "{{SIMPLE_SV_PANEL}}"
  fusion_pairs: "{{SIMPLE_SV_FUSION_PAIRS}}"

annotate_small_variants: false
annotate_svs: false

multiqc:
  container: "docker://hydragenetics/multiqc:1.11"
  use_input_files_only: true
  reports:
    nanopore:
      included_unit_types: [N, T, R]
      qc_files:
        - "qc/cramino/{sample}_{type}.txt"
        - "qc/mosdepth/{sample}_{type}.mosdepth.summary.txt"
        - "qc/mosdepth/{sample}_{type}.mosdepth.global.dist.txt"
        - "qc/mosdepth/{sample}_{type}.mosdepth.region.dist.txt"
        - "qc/mosdepth_bed/{sample}_{type}.mosdepth.summary.txt"
        - "qc/mosdepth_bed/{sample}_{type}.mosdepth.global.dist.txt"
        - "qc/mosdepth_bed/{sample}_{type}.mosdepth.region.dist.txt"
        - "reports/sv_summary/{sample}_{type}.tsv"
