---
# Shared pipeline configuration. Site-specific paths and runtime settings live
# under config/site_configs/. The launcher merges the selected site file and
# expands the {{VARIABLE}} values before Snakemake starts.
SITE_ID: local
HYDRA_LOCAL_PATH: "vendor"
RESOURCES_FILE: "config/resources.yaml"
DEFAULT_CONTAINER: "docker://hydragenetics/common:3.1.1"
REFERENCE_ROOT: "references"
CONTAINER_CACHE: "vendor/containers"

# These defaults keep direct local Snakemake invocations useful. A site config
# may replace any of them with absolute paths on a workstation or cluster.
HG38_FASTA: "references/hg38/GRCh38.fa"
HG38_FAI: "references/hg38/GRCh38.fa.fai"
HG38_DICT: "references/hg38/GRCh38.dict"
HG38_MMI: ""
# Default design BED for adaptive sampling on GRCh38/hg38
HG38_DESIGN_BED: "workflow/resources/adaptive/dic_9_20_iamp21_hg38.bed"
HG38_SV_ANNOTATION_BED: ""
HG38_TANDEM_REPEATS: ""
HG38_CLINVAR: ""
HG38_CYTOBAND: ""
HG38_GAPS_BED: ""
HG38_GTF: ""
HG38_ANNOTATIONS: ""
HS1_FASTA: "references/hs1/chm13v2.0.fa"
HS1_FAI: "references/hs1/chm13v2.0.fa.fai"
HS1_DICT: "references/hs1/chm13v2.0.dict"
HS1_MMI: ""
# Default design BED for adaptive sampling on T2T/hs1
HS1_DESIGN_BED: "workflow/resources/adaptive/dic_9_20_iamp21_T2T.bed"
HS1_SV_ANNOTATION_BED: ""
HS1_TANDEM_REPEATS: ""
HS1_CLINVAR: ""
HS1_CYTOBAND: ""
HS1_GAPS_BED: ""
HS1_GTF: ""
HS1_ANNOTATIONS: ""
# hg19/GRCh37, for the bcr_abl assay only. See the `references.hg19` comment
# below for why this build cannot be produced by lifting hg38 coordinates.
HG19_FASTA: "references/hg19/hg19.fa"
HG19_FAI: "references/hg19/hg19.fa.fai"
HG19_DICT: "references/hg19/hg19.dict"
HG19_MMI: ""
# Shipped with nagini (copied from pickett_bcr_abl_pipeline's own exon BED) so
# this does not depend on a separate checkout being present at runtime.
HG19_DESIGN_BED: "workflow/resources/bcr_abl/bcr_abl1_exons_hg19.bed"
VEP_CACHE: ""
SNPEFF_DB: ""
SIMPLE_SV_PANEL: ""
SIMPLE_SV_FUSION_PAIRS: ""
# Pinned deliberately: with a shared singularity cache, a floating :latest tag
# means the workstation and the cluster can silently run different versions of
# the caller. v0.4.4 is what :latest resolved to on 2026-05-11.
CLAIRS_TO_CONTAINER: "docker://hkubal/clairs-to:v0.4.4"
DEEPVARIANT_CONTAINER: "docker://google/deepvariant:1.6.0"
ARRIBA_CONTAINER: "docker://uhrigs/arriba:2.4.0"



site: "{{SITE_ID}}"
hydra_local_path: "{{HYDRA_LOCAL_PATH}}"

samples: "config/samples.tsv"
units: "config/units.tsv"
output: "config/output_files.yaml"
resources: "{{RESOURCES_FILE}}"
default_container: "{{DEFAULT_CONTAINER}}"
container_cache: "{{CONTAINER_CACHE}}"
container_runtime: singularity
singularity_binds: []

modules:
  alignment: "v0.8.0"
  annotation: "v1.4.1"
  cnv_sv: "v3.2.1"
  qc: "v0.8.0"
  # Local compatibility tag derived from Hydra snv_indels v2.1.0; see
  # build/patches/snv_indels_v2.1.0_snakemake7.patch.
  snv_indels: "v2.1.0-nagini"

reference_build: "hg38"
references:
  hg38:
    fasta: "{{HG38_FASTA}}"
    fai: "{{HG38_FAI}}"
    dict: "{{HG38_DICT}}"
    mmi: "{{HG38_MMI}}"
    design_bed: "{{HG38_DESIGN_BED}}"
    sv_annotation_bed: "{{HG38_SV_ANNOTATION_BED}}"
    tandem_repeats: "{{HG38_TANDEM_REPEATS}}"
    clinvar: "{{HG38_CLINVAR}}"
    cytoband: "{{HG38_CYTOBAND}}"
    gaps_bed: "{{HG38_GAPS_BED}}"
    gene_annotation: "{{HG38_GTF}}"
    annotations: "{{HG38_ANNOTATIONS}}"
    chromosomes: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22, chrX, chrY]
    skip_chrs: [chrM]
  hs1:
    fasta: "{{HS1_FASTA}}"
    fai: "{{HS1_FAI}}"
    dict: "{{HS1_DICT}}"
    mmi: "{{HS1_MMI}}"
    design_bed: "{{HS1_DESIGN_BED}}"
    sv_annotation_bed: "{{HS1_SV_ANNOTATION_BED}}"
    tandem_repeats: "{{HS1_TANDEM_REPEATS}}"
    clinvar: "{{HS1_CLINVAR}}"
    cytoband: "{{HS1_CYTOBAND}}"
    gaps_bed: "{{HS1_GAPS_BED}}"
    gene_annotation: "{{HS1_GTF}}"
    annotations: "{{HS1_ANNOTATIONS}}"
    chromosomes: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22, chrX, chrY]
    skip_chrs: [chrM]
  # hg19/GRCh37, needed only for the bcr_abl assay: pickett_bcr_abl_pipeline's
  # Branford resistance-position list and exon BED are hg19, and a liftover
  # would introduce a coordinate error into exactly what that assay measures.
  # A single Snakemake run uses one reference_build for every sample, so a
  # flowcell mixing bcr_abl with an hg38 assay currently needs two separate
  # nagini invocations, one per build; this is a known limitation, not
  # something this config section can fix.
  hg19:
    fasta: "{{HG19_FASTA}}"
    fai: "{{HG19_FAI}}"
    dict: "{{HG19_DICT}}"
    mmi: "{{HG19_MMI}}"
    design_bed: "{{HG19_DESIGN_BED}}"
    sv_annotation_bed: ""
    tandem_repeats: ""
    clinvar: ""
    cytoband: ""
    gaps_bed: ""
    gene_annotation: ""
    annotations: ""
    chromosomes: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22, chrX, chrY]
    skip_chrs: [chrM]

# ---------------------------------------------------------------------------
# Assay registry
# ---------------------------------------------------------------------------
# Which analysis runs for a sample is decided by its `assay` column in
# units.tsv; how its reads are aligned is decided by `library_type`. Keeping
# those apart is what lets a cDNA amplicon be spliced *and* variant called.
#
# The definitions below are merged over the built-in ones in
# workflow/scripts/nagini_routing.py, so adding an assay is a config edit:
#
#   assays:
#     my_panel:
#       library_type: amplicon      # wgs | amplicon | cdna | direct_rna
#       snv_calling: true
#       sv_calling: false
#       target_restricted: true     # confine analysis to reference.design_bed
#       modules: [my_panel]         # assay-specific rules to switch on
#
# Built in already: wgs, adaptive, amplicon, cdna, bcr_abl. Override any of
# them here; anything not listed keeps its built-in definition.
assays: {}

read_filter:
  # Pre-alignment read filtering with nanostream (the unified CLI from the
  # nanoMonitor workspace). There is no Python fallback: if the binary cannot
  # be resolved the run stops rather than silently filtering differently.
  #
  # nanostream computes mean read quality as -10*log10(mean(10^(-q/10))).
  # On BAM input it reads the qs tag directly; on FASTQ it recomputes from the
  # quality string with that same formula, so the value matches a dorado
  # qs:i header tag to within its integer rounding. It does not currently read
  # the qs:i tag out of the FASTQ header itself.
  enabled: false
  # Empty: look for nanostream (then nanofilter) on PATH, then
  # workflow/bin/<os>-<arch>/nanostream. Set to an absolute path to pin it.
  binary: ""
  min_qv: 20
  length_range: "500-3000"
  extra: ""
  threads: 4

# Passed verbatim to minimap2. Add/remove methylation- or SAM-related flags

# here, for example --MD or -y, according to the basecaller and downstream
# modification workflow. The alignment rule also adds an @RG line by default.
minimap2_align:
  preset: "map-ont"
  # The preset a site-provided reference.mmi was built with. Units needing a
  # different preset (cDNA needs splice) are aligned against the FASTA instead,
  # because a prebuilt index silently keeps its own -k/-w.
  index_preset: "map-ont"
  extra: "-y -Y --MD"
  read_group: ""
  container: "docker://hydragenetics/minimap2:2.26"

minimap2_index:
  container: "docker://hydragenetics/common:3.1.1"

sniffles2_call:
  container: "docker://hydragenetics/sniffles2:2.2"
  tandem_repeats: ""
  extra: ""

dorado:
  container: "docker://ontresearch/dorado:shac8f356489fa8b44b31beba841b84d2879de2088e"
  input: ""
  model: "hac"
  kit: ""
  device: ""
  models_directory: ""
  basecaller_extra: ""
  demux_extra: ""
  # bam keeps one unaligned BAM per barcode; fastq makes the BAM temporary;
  # both retains the BAM and also exports a gzip-compressed FASTQ.
  demux_output_format: "fastq"
  allow_empty_barcodes: false
  basecaller_threads: 8
  demux_threads: 8

dorado_alignment:
  # The raw per-barcode BAM remains unaligned. This selector controls the
  # separate downstream alignment used by callers and coverage tools.
  aligner: "minimap2"
  extra: ""

dorado_demux_bam:
  container: "docker://hydragenetics/common:3.1.1"

dorado_fastq:
  container: "docker://hydragenetics/common:3.1.1"

finalize_dorado_alignment:
  container: "docker://hydragenetics/common:3.1.1"

samtools_fastq:
  # -T carries MM/ML tags into FASTQ comments. minimap2 -y copies those
  # comments back into SAM auxiliary fields; -Y controls supplementary clips.
  extra: "-n -T MM,ML"

# Write one FASTQ per sample to reads/nagini_fastq/, merged across flowcells,
# for archiving or handing the reads to another tool. Off by default: for a
# whole-genome run it roughly doubles the space the reads take on disk. Only
# available for unaligned BAM input, since it is built from the source BAMs.
merged_fastq: false

mosdepth:
  by: "500"
  container: "docker://hydragenetics/mosdepth:0.3.2"
  extra: "--fast-mode --no-per-base"

mosdepth_bed:
  container: "docker://hydragenetics/mosdepth:0.3.2"
  extra: ""

cramino:
  container: "docker://hydragenetics/cramino:0.14.5"
  extra: ""

small_variant_caller: "auto"

clairs_to_call:
  container: "{{CLAIRS_TO_CONTAINER}}"
  # Leave platform empty to derive the ClairS-TO error model from each sample's
  # basecalling_model in units.tsv. Setting it here overrides that for every
  # sample. An unrecognised model warns and falls back to default_platform.
  platform: ""
  default_platform: "ont_r10_dorado_sup_5khz"
  # Extra "chemistry,accuracy,sampling: platform" entries, for models newer
  # than this release. Example: "r10,sup,5khz": "ont_r10_dorado_sup_5khz"
  platform_map: {}
  # Floors for whole-genome depth. Targeted assays lower them through their
  # assay definition rather than here; see the assays block above.
  snv_min_af: 0.05
  indel_min_af: 0.1
  extra: ""

clairs_to_concat:
  container: "docker://hydragenetics/common:3.1.1"
  extra: ""

bcftools_norm_clairs_to:
  container: "docker://hydragenetics/common:3.1.1"
  extra: "--multiallelics -both --check-ref w"

deepvariant:
  container: "{{DEEPVARIANT_CONTAINER}}"
  model_type: "ONT_R104"
  threads: 8
  extra: ""
  output_gvcf: false

bcftools_norm_deepvariant:
  container: "docker://hydragenetics/common:3.1.1"
  extra: "--multiallelics -both --check-ref w"


gatk_mutect2:
  container: "docker://hydragenetics/gatk4:4.2.2.0"
  # Mutect2 is retained because it is part of the requested analysis, but
  # its ONT error model and filtering require validation for the intended use.
  extra: ""

gatk_merge_mutect_stats:
  container: "docker://hydragenetics/gatk4:4.2.2.0"
  extra: ""

gatk_filter_mutect_calls:
  container: "docker://hydragenetics/gatk4:4.2.2.0"
  extra: ""

bcftools_norm_mutect2:
  container: "docker://hydragenetics/common:3.1.1"
  extra: "--multiallelics -both --check-ref w"

# VEP is optional because its offline cache must match the selected reference.
# The normalized filtered VCF is used in the report when this is false.
annotate_small_variants_with_vep: false
vep:
  container: "docker://hydragenetics/vep:111.0"
  vep_cache: "{{VEP_CACHE}}"
  skip: false
  mode: "--offline --cache --merged"
  extra: "--assembly GRCh38 --check_existing --pick --variant_class --symbol --hgvs"

nagini_excel_report:
  # The report is written with xlsxwriter, as in the other CGU pipelines.
  # It is present in hydragenetics/common and in envs/nagini.yaml.
  container: "docker://hydragenetics/common:3.1.1"

snpeff:
  container: "docker://hydragenetics/snpeff:5.0"
  db: "{{SNPEFF_DB}}"
  extra: "-nodownload"

simple_sv_annotation:
  container: "docker://hydragenetics/simple_sv_annotation:2019.02.18"
  panel: "{{SIMPLE_SV_PANEL}}"
  fusion_pairs: "{{SIMPLE_SV_FUSION_PAIRS}}"

arriba:
  container: "{{ARRIBA_CONTAINER}}"
  extra: ""
  protein_domains: ""
# Copy Number Variant (CNV) calling with Rindels
# Whole-genome read-count binning and segmentation (ASCAT model)
# Operates genome-wide even in adaptive sampling mode.
cnv_calling: true
rindels:
  binary: "rindels"
  cnv_bin_size: 50000
  # --sv-lite rather than --only-cnv: --only-cnv implies --no-snp, which
  # leaves the ASCAT-style BAF segmentation without heterozygous markers, so
  # it produces binned counts and parquet sidecars but no .ascat.bed for
  # cnv_summary to read. --sv-lite keeps SNP calling (hence BAF, segmentation
  # and purity/ploidy) and adds DEL/DUP/INV/TRA from pair and clip evidence
  # without assembly, which is what a dic(9;20) or iAMP21 design is looking
  # for. Use --ascat-markers with a common-SNP panel to keep --only-cnv fast.
  extra_cnv: "--ont --sv-lite"
  # Rindels' unified PDF report. It has no assembly option: the ideogram gaps
  # are hg38 whatever reference the run was given, so on a non-hg38 build the
  # picture is drawn on the wrong coordinates. Set to false for T2T runs and
  # use the Ideogram sheet in the Excel report, which takes the build's own
  # centromeres.
  report: true
  threads: 4

# CNVkit: whole-genome copy-number calling from ONT BAMs.
# Runs in parallel with Rindels. Set cnv_engine: rindels_only to skip.
cnv_engine: "both"  # options: both | rindels_only
cnvkit_batch:
  container: "docker://hydragenetics/cnvkit:0.9.11"
  method: "wgs"
  # Bin size in base pairs. Used by the cnvkit_targets rule, which tiles the
  # accessible genome once per reference build; batch is then handed those bins
  # with --targets rather than deriving its own. CNVkit's default of 5000 is too
  # small for ONT long reads, causing extreme midpoint sparsity with
  # --count-reads; 50000 or 100000 is recommended.
  target_avg_size: 50000
  # --count-reads: count read midpoints instead of per-base depth — critical for
  #                performance with long-read data (complex CIGAR strings make
  #                the default pysam depth calculation extremely slow).
  extra: "--count-reads"
  threads: 8
  mem_mb: 16384

# Whole-genome ideogram drawn by `rindels ideogram` from the binned read
# counts and the BAF track, embedded on its own sheet in the Excel report.
# Centromeres are derived from the reference build's own cytoband table, since
# Rindels otherwise falls back to a built-in hg38 set that is wrong on T2T.
rindels_ideogram:
  width: 2000
  height: 2400
  extra: ""

# Interactive HTML CNV report (D3.js, mirrors Illumina pipeline reports).
cnv_html_report:
  container: "docker://hydragenetics/common:3.1.1"
  show_table: false   # No filtered CNV VCFs in tumor-only mode
  cytobands: true     # Visualise cytobands in the chromosome plot
  wide_plot_width: 2000

merge_cnv_json:
  container: "docker://hydragenetics/common:3.1.1"
  # cytobands: path to UCSC-format cytoband file; resolved from references.<build>.cytoband

cnv_json:
  container: "docker://hydragenetics/common:3.1.1"

bcr_abl:
  tolerance: 150
  min_mapq: 1
  min_af: 0.01
  min_depth: 50
  min_alt_reads: 5
  max_depth: 1000000
  min_spanning_reads: 10

amplicon:
  top_n: 0
  min_qs: 10
  len_range: "1000-3500"
  threads: 8
  rindels_extra: "--ont --amplicon"
  # FLT3-ITD is derived from insertions in the long-read Rindels VCF inside the
  # FLT3 exon 13-15 target (amplicon_targets.bed), not across the whole 3 kb
  # amplicon: an insertion outside the duplication hotspot is not an ITD.
  # "rindels itd" is a short-read caller and is deliberately not used here.
  flt3_itd_region: "chr13:28033864-28034426"
  flt3_itd_min_length: 6
  flt3_itd_min_vaf: 1.0
  # neville_mx_amplicon comparison report
  neville_callers_label: "rindels"
  neville_min_af: 0.005
  neville_min_sv_length: 50

# VEP settings for the neville comparison report only. These are neville's own
# flags: a different --pick_order selects a different transcript, and the same
# variant would then carry a different HGVSc/ENSP in the two reports.
amplicon_vep:
  container: "docker://hydragenetics/vep:111.0"
  mode: "--offline --cache --merged"
  extra: "--format vcf --assembly GRCh38 --check_existing --pick --variant_class --everything
    --pick_order mane_select,mane_plus_clinical,canonical,biotype,rank,appris,tsl,ccds,length,ensembl,refseq"
  threads: 4


annotate_small_variants: false
annotate_svs: false

multiqc:
  container: "docker://hydragenetics/multiqc:1.11"
  use_input_files_only: true
  reports:
    nanopore:
      included_unit_types: [N, T, R]
      # Flowcell-level QC, included only when the run demultiplexed barcodes.
      run_files:
        - "qc/dorado_demux/dorado_demux_mqc.tsv"
      qc_files:
        - "qc/cramino/{sample}_{type}.txt"
        - "qc/mosdepth/{sample}_{type}.mosdepth.summary.txt"
        - "qc/mosdepth/{sample}_{type}.mosdepth.global.dist.txt"
        - "qc/mosdepth/{sample}_{type}.mosdepth.region.dist.txt"
        - "qc/mosdepth_bed/{sample}_{type}.mosdepth.summary.txt"
        - "qc/mosdepth_bed/{sample}_{type}.mosdepth.global.dist.txt"
        - "qc/mosdepth_bed/{sample}_{type}.mosdepth.region.dist.txt"
        - "reports/sv_summary/{sample}_{type}.tsv"
