---
# Local development: runtime settings only.
#
# Reference paths live in config/reference_files/reference_files_local.yaml.
# Set a variable here only to override the inventory for this site.
SITE_ID: local
REFERENCE_ROOT: references
CONTAINER_CACHE: vendor/containers
HYDRA_LOCAL_PATH: vendor
RESOURCES_FILE: config/resources.yaml
DEFAULT_CONTAINER: docker://hydragenetics/common:3.1.1

# The checkout-relative local profile does not ship an hs1/T2T bundle.

# Informational values retained in the run snapshot. The local profile owns
# the actual Snakemake container options.
container_runtime: singularity
singularity_binds: []

# Pin before clinical use.
CLAIRS_TO_CONTAINER: "docker://hkubal/clairs-to:latest"
