---
# CGU Linux workstation: runtime settings only.
#
# Reference paths live in config/reference_files/reference_files_workstation.yaml.
# Set a variable here only to override the inventory for this site.
#
# VEP is deliberately disabled until the offline cache has finished
# synchronising; set annotate_small_variants_with_vep=true and vep.skip=false
# when it is ready.
SITE_ID: workstation
REFERENCE_ROOT: /data/references
CONTAINER_DIR: /data/containers
HYDRA_LOCAL_PATH: vendor
RESOURCES_FILE: config/resources/resources_workstation.yaml

# The initial workstation test can run without VEP.  ClinVar is wired into
# the VEP command and will be used automatically once this switch is enabled.
annotate_small_variants_with_vep: false
vep:
  skip: true
annotate_svs: false

# Singularity/Apptainer must see the external reference mount.
container_runtime: singularity
singularity_binds:
  - /data
  - /var/lib/minknow/data
  - /home
  - /coldstorage

