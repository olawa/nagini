---
# Marvin cluster: runtime settings only.
#
# Reference paths live in config/reference_files/reference_files_marvin.yaml.
# Set a variable here only to override the inventory for this site.
SITE_ID: marvin
REFERENCE_ROOT: /beegfs-storage/data/ref_genomes
CONTAINER_CACHE: /beegfs-storage/projects/wp4/nobackup/singularity_cache
HYDRA_LOCAL_PATH: vendor
RESOURCES_FILE: config/resources_marvin.yaml
DEFAULT_CONTAINER: docker://hydragenetics/common:3.1.1

# No verified hs1/T2T path was present in the Marvin configuration.

# These annotation branches were enabled by the previous Marvin composite
# config and remain site-specific because their databases are not part of a
# generic workstation bundle.
annotate_small_variants_with_vep: true
annotate_svs: true
vep:
  skip: false
  extra: "--assembly GRCh38 --check_existing --pick --variant_class --everything"

container_runtime: singularity
singularity_binds:
  - /beegfs-archive
  - /beegfs-scratch
  - /beegfs-storage
  - /home
  - /data
  - /projects

# Pin before clinical use.
CLAIRS_TO_CONTAINER: "docker://hkubal/clairs-to:latest"
