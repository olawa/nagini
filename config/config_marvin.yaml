---
# Backwards-compatible Marvin composite configuration.
#
# New runs should use config/config.yaml together with
# config/site_configs/site_config_marvin.yaml (the start script does this
# automatically with --site marvin). This file remains for older direct
# Snakemake commands until they are migrated.
hydra_local_path: "vendor"

samples: "config/samples.tsv"
units: "config/units.tsv"
output: "config/output_files.yaml"
resources: "config/resources_marvin.yaml"
default_container: "docker://hydragenetics/common:3.1.1"

modules:
  alignment: "v0.8.0"
  annotation: "v1.4.1"
  cnv_sv: "v3.2.1"
  qc: "v0.8.0"
  snv_indels: "v2.1.0-nagini"

reference_build: "hg38"
references:
  hg38:
    fasta: "/beegfs-storage/data/ref_genomes/GRCh38/GRCmasked/GCA_000001405.15_GRCh38_no_alt_analysis_set_GRCmasked.fasta"
    fai: "/beegfs-storage/data/ref_genomes/GRCh38/GRCmasked/GCA_000001405.15_GRCh38_no_alt_analysis_set_GRCmasked.fasta.fai"
    dict: "/beegfs-storage/data/ref_genomes/GRCh38/GRCmasked/GCA_000001405.15_GRCh38_no_alt_analysis_set_GRCmasked.dict"
    mmi: ""
    design_bed: "/beegfs-storage/data/ref_genomes/GRCh38/GRCmasked/homo_sapiens.hg38.wgs.bed"
    sv_annotation_bed: "/beegfs-storage/data/ref_genomes/GRCh38/simple_sv_annotation/simple_repeats.merged.bed.gz"
    tandem_repeats: "/beegfs-storage/data/ref_genomes/GRCh38/simple_sv_annotation/simple_repeats.merged.bed.gz"
    clinvar: ""
    cytoband: ""
    gene_annotation: ""
    annotations: ""
    chromosomes: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22, chrX, chrY]
    skip_chrs: [chrM]
  hs1:
    fasta: "references/hs1/chm13v2.0.fa"
    fai: "references/hs1/chm13v2.0.fa.fai"
    dict: "references/hs1/chm13v2.0.dict"
    mmi: ""
    design_bed: "references/hs1/targets.bed"
    sv_annotation_bed: ""
    tandem_repeats: ""
    clinvar: ""
    cytoband: ""
    gene_annotation: ""
    annotations: ""
    chromosomes: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22, chrX, chrY]
    skip_chrs: [chrM]

minimap2_align:
  preset: "map-ont"
  extra: "-y -Y --MD"
  read_group: ""
  container: "docker://hydragenetics/minimap2:2.26"
minimap2_index:
  container: "docker://hydragenetics/common:3.1.1"
samtools_fastq:
  extra: "-n -T MM,ML"

sniffles2_call:
  container: "docker://hydragenetics/sniffles2:2.2"
  tandem_repeats: ""
  extra: ""
mosdepth:
  by: "500"
  container: "docker://hydragenetics/mosdepth:0.3.2"
  extra: "--fast-mode --no-per-base"
mosdepth_bed:
  container: "docker://hydragenetics/mosdepth:0.3.2"
dorado:
  container: "docker://ontresearch/dorado:shac8f356489fa8b44b31beba841b84d2879de2088e"
  demux_output_format: "fastq"
  allow_empty_barcodes: false
  basecaller_threads: 24
  demux_threads: 20
  basecaller_partition: "gpu"
  demux_partition: "core"
  basecaller_mem_mb: 120000
  demux_mem_mb: 122880
dorado_alignment:
  aligner: "minimap2"
  extra: ""
dorado_demux_bam:
  container: "docker://hydragenetics/common:3.1.1"
dorado_fastq:
  container: "docker://hydragenetics/common:3.1.1"
finalize_dorado_alignment:
  container: "docker://hydragenetics/common:3.1.1"
cramino:
  container: "docker://hydragenetics/cramino:0.14.5"
small_variant_caller: "clairs_to"
clairs_to_call:
  container: "docker://hkubal/clairs-to:latest"
  platform: "ont_r10_dorado_hac_4khz"
  snv_min_af: 0.05
  indel_min_af: 0.1
  extra: ""
  threads: 24
  mem_mb: 64000
clairs_to_concat:
  container: "docker://hydragenetics/common:3.1.1"
  extra: ""
bcftools_norm_clairs_to:
  container: "docker://hydragenetics/common:3.1.1"
  extra: "--multiallelics -both --check-ref w"
gatk_mutect2:
  container: "docker://hydragenetics/gatk4:4.2.2.0"
  extra: ""
gatk_merge_mutect_stats:
  container: "docker://hydragenetics/gatk4:4.2.2.0"
gatk_filter_mutect_calls:
  container: "docker://hydragenetics/gatk4:4.2.2.0"
bcftools_norm_mutect2:
  container: "docker://hydragenetics/common:3.1.1"
  extra: "--multiallelics -both --check-ref w"

annotate_small_variants_with_vep: true
vep:
  container: "docker://hydragenetics/vep:111.0"
  vep_cache: "/data/ref_genomes/VEP/"
  skip: false
  mode: "--offline --cache --merged"
  extra: "--assembly GRCh38 --check_existing --pick --variant_class --everything"
nagini_excel_report:
  container: "docker://hydragenetics/common:3.1.1"

# These paths are present in the existing Fluffy Marvin configuration. The
# two annotation branches are enabled here; disable them if a database is not
# mounted in the Marvin job environment.
snpeff:
  container: "docker://hydragenetics/snpeff:5.0"
  db: "/data/ref_genomes/GRCh38/snpeff/data/GRCh38.99"
  extra: "-nodownload"
simple_sv_annotation:
  container: "docker://hydragenetics/simple_sv_annotation:2019.02.18"
  panel: "/data/ref_genomes/GRCh38/simple_sv_annotation/az-cancer-panel.txt"
  fusion_pairs: "/data/ref_genomes/GRCh38/simple_sv_annotation/fusion_pairs.txt"
annotate_small_variants: false
annotate_svs: true

multiqc:
  container: "docker://hydragenetics/multiqc:1.11"
  use_input_files_only: true
  reports:
    nanopore:
      included_unit_types: [N, T, R]
      qc_files:
        - "qc/cramino/{sample}_{type}.txt"
        - "qc/mosdepth/{sample}_{type}.mosdepth.summary.txt"
        - "qc/mosdepth/{sample}_{type}.mosdepth.global.dist.txt"
        - "qc/mosdepth/{sample}_{type}.mosdepth.region.dist.txt"
        - "qc/mosdepth_bed/{sample}_{type}.mosdepth.summary.txt"
        - "qc/mosdepth_bed/{sample}_{type}.mosdepth.global.dist.txt"
        - "qc/mosdepth_bed/{sample}_{type}.mosdepth.region.dist.txt"
        - "reports/sv_summary/{sample}_{type}.tsv"
