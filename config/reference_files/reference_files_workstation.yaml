---
# Reference inventory for the workstation site.
#
# reference_root is where this site keeps its reference tree, taken from the
# site config's REFERENCE_ROOT so the location is declared once. Every `path`
# below is relative to it, so moving the tree is a one-line change.
#
# Assets that ship inside the nagini repo (the adaptive design BEDs, the
# BCR-ABL1 exon BED) are deliberately not listed here: they are defaulted in
# config/config.yaml and resolved against the checkout, not the reference tree.
#
# type: file | directory | optional. An empty path means the asset is not
# installed at this site, which overrides the shared default rather than
# falling through to it. Empty checksums are not verified; fill them in and
# run the launcher with --verify-references to check them.
site: workstation
reference_root: "{{REFERENCE_ROOT}}"
reference_builds:
  hg38:
    fasta:
      path: GRCh38_no_alt_analysis_set.fasta
      type: file
      url: file:/data/references/GRCh38_no_alt_analysis_set.fasta
      checksum: ''
    fai:
      path: GRCh38_no_alt_analysis_set.fasta.fai
      type: file
      url: file:/data/references/GRCh38_no_alt_analysis_set.fasta.fai
      checksum: ''
    dict:
      path: GRCh38_no_alt_analysis_set.dict
      type: file
      url: file:/data/references/GRCh38_no_alt_analysis_set.dict
      checksum: ''
    minimap2_index:
      path: GRCh38_no_alt_analysis_set.mmi
      type: file
      url: file:/data/references/GRCh38_no_alt_analysis_set.mmi
      checksum: ''
    tandem_repeats:
      path: human_GRCh38_no_alt_analysis_set.trf.bed
      type: file
      url: file:/data/references/human_GRCh38_no_alt_analysis_set.trf.bed
      checksum: ''
    clinvar:
      path: clinvar.vcf.gz
      type: file
      url: file:/data/references/clinvar.vcf.gz
      checksum: ''
    clinvar_index:
      path: clinvar.vcf.gz.tbi
      type: file
      url: file:/data/references/clinvar.vcf.gz.tbi
      checksum: ''
    gene_annotation:
      path: gencode.v46.annotation.sorted.gtf
      type: file
      url: file:/data/references/gencode.v46.annotation.sorted.gtf
      checksum: ''
    annotations:
      path: annotations
      type: directory
      url: file:/data/references/annotations
      checksum: ''
  hs1:
    fasta:
      path: hs1.fa
      type: file
      url: file:/data/references/hs1.fa
      checksum: ''
    fai:
      path: hs1.fa.fai
      type: file
      url: file:/data/references/hs1.fa.fai
      checksum: ''
    dict:
      path: hs1.dict
      type: file
      url: file:/data/references/hs1.dict
      checksum: ''
    minimap2_index:
      path: hs1.mmi
      type: file
      url: file:/data/references/hs1.mmi
      checksum: ''
  hg19:
    fasta:
      path: hg19/hg19.fa
      type: file
      url: ''
      checksum: ''
    fai:
      path: hg19/hg19.fa.fai
      type: file
      url: ''
      checksum: ''
    dict:
      path: hg19/hg19.dict
      type: file
      url: ''
      checksum: ''
annotations:
  vep_cache:
    path: /data/references/vep_cache
    type: directory
    url: file:/data/references/vep_cache
    checksum: ''
  snpeff_db:
    path: ''
    type: optional
    url: ''
    checksum: ''
  simple_sv_panel:
    path: ''
    type: optional
    url: ''
    checksum: ''
  simple_sv_fusion_pairs:
    path: ''
    type: optional
    url: ''
    checksum: ''
