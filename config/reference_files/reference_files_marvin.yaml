    # registry (its "url" field, which points at the shared reference tree
    # rather than its project-local cache) and this file's own hg38 entry's
    # path convention (/beegfs-storage/data/ref_genomes/...). Confirm this
    # path exists on marvin and re-run with --verify-references before first
    # use; consider pointing this at pickett's exact hg19.with.mt.fasta
    # instead if that is what BCR-ABL1 BAMs on marvin are already aligned to.
