---
# Reference inventory for the marvin site.
#
# reference_root is where this site keeps its reference tree, taken from the
# site config's REFERENCE_ROOT so the location is declared once. Every `path`
# below is relative to it, so moving the tree is a one-line change.
#
# Assets that ship inside the nagini repo (the adaptive design BEDs, the
# BCR-ABL1 exon BED) are deliberately not listed here: they are defaulted in
# config/config.yaml and resolved against the checkout, not the reference tree.
#
# type: file | directory | optional. An empty path means the asset is not
# installed at this site, which overrides the shared default rather than
# falling through to it. Empty checksums are not verified; fill them in and
# run the launcher with --verify-references to check them.
site: marvin
reference_root: "{{REFERENCE_ROOT}}"
reference_builds:
  hg38:
    fasta:
      path: GRCh38/GRCmasked/GCA_000001405.15_GRCh38_no_alt_analysis_set_GRCmasked.fasta
      type: file
      url: file:/beegfs-storage/data/ref_genomes/GRCh38/GRCmasked/GCA_000001405.15_GRCh38_no_alt_analysis_set_GRCmasked.fasta
      checksum: ''
    fai:
      path: GRCh38/GRCmasked/GCA_000001405.15_GRCh38_no_alt_analysis_set_GRCmasked.fasta.fai
      type: file
      url: file:/beegfs-storage/data/ref_genomes/GRCh38/GRCmasked/GCA_000001405.15_GRCh38_no_alt_analysis_set_GRCmasked.fasta.fai
      checksum: ''
    dict:
      path: GRCh38/GRCmasked/GCA_000001405.15_GRCh38_no_alt_analysis_set_GRCmasked.dict
      type: file
      url: file:/beegfs-storage/data/ref_genomes/GRCh38/GRCmasked/GCA_000001405.15_GRCh38_no_alt_analysis_set_GRCmasked.dict
      checksum: ''
    sv_annotation_bed:
      path: GRCh38/simple_sv_annotation/simple_repeats.merged.bed.gz
      type: file
      url: file:/beegfs-storage/data/ref_genomes/GRCh38/simple_sv_annotation/simple_repeats.merged.bed.gz
      checksum: ''
    tandem_repeats:
      path: GRCh38/simple_sv_annotation/simple_repeats.merged.bed.gz
      type: file
      url: file:/beegfs-storage/data/ref_genomes/GRCh38/simple_sv_annotation/simple_repeats.merged.bed.gz
      checksum: ''
  hs1:
    fasta:
      path: ''
      type: optional
      url: ''
      checksum: ''
    fai:
      path: ''
      type: optional
      url: ''
      checksum: ''
    dict:
      path: ''
      type: optional
      url: ''
      checksum: ''
  hg19:
    fasta:
      path: hg19/genome_fasta/hg19.with.mt.fasta
      type: file
      url: ''
      checksum: ''
    fai:
      path: hg19/genome_fasta/hg19.with.mt.fasta.fai
      type: file
      url: ''
      checksum: ''
    dict:
      path: hg19/genome_fasta/hg19.with.mt.dict
      type: file
      url: ''
      checksum: ''
annotations:
  vep_cache:
    path: /data/ref_genomes/VEP
    type: directory
    url: file:/data/ref_genomes/VEP
    checksum: ''
  snpeff_db:
    path: /data/ref_genomes/GRCh38/snpeff/data/GRCh38.99
    type: directory
    url: file:/data/ref_genomes/GRCh38/snpeff/data/GRCh38.99
    checksum: ''
  simple_sv_panel:
    path: /data/ref_genomes/GRCh38/simple_sv_annotation/az-cancer-panel.txt
    type: file
    url: file:/data/ref_genomes/GRCh38/simple_sv_annotation/az-cancer-panel.txt
    checksum: ''
  simple_sv_fusion_pairs:
    path: /data/ref_genomes/GRCh38/simple_sv_annotation/fusion_pairs.txt
    type: file
    url: file:/data/ref_genomes/GRCh38/simple_sv_annotation/fusion_pairs.txt
    checksum: ''
