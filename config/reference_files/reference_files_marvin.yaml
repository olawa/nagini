---
# Reference inventory for the marvin site.
#
# This is where a reference path is declared. The launcher flattens it into
# the {{VARIABLE}} names used by config/config.yaml, so the site config only
# needs to override a path when it genuinely differs from the inventory.
#
# type: file | directory | optional. Empty checksums are not verified;
# fill them in and run the launcher with --verify-references to check them.
site: marvin
reference_builds:
  hg38:
    fasta:
      path: /beegfs-storage/data/ref_genomes/GRCh38/GRCmasked/GCA_000001405.15_GRCh38_no_alt_analysis_set_GRCmasked.fasta
