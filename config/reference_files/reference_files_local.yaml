---
# Reference inventory for the local site.
#
# reference_root is where this site keeps its reference tree, taken from the
# site config's REFERENCE_ROOT so the location is declared once. Every `path`
# below is relative to it, so moving the tree is a one-line change.
#
# Assets that ship inside the nagini repo (the adaptive design BEDs, the
# BCR-ABL1 exon BED) are deliberately not listed here: they are defaulted in
# config/config.yaml and resolved against the checkout, not the reference tree.
#
# type: file | directory | optional. An empty path means the asset is not
# installed at this site, which overrides the shared default rather than
# falling through to it. Empty checksums are not verified; fill them in and
# run the launcher with --verify-references to check them.
site: local
reference_root: "{{REFERENCE_ROOT}}"
reference_builds:
  hg38:
    fasta:
      path: hg38/GRCh38.fa
      type: file
      url: file:references/hg38/GRCh38.fa
      checksum: ''
    fai:
      path: hg38/GRCh38.fa.fai
      type: file
      url: file:references/hg38/GRCh38.fa.fai
      checksum: ''
    dict:
      path: hg38/GRCh38.dict
      type: file
      url: file:references/hg38/GRCh38.dict
      checksum: ''
  hs1:
    fasta:
      path: hs1/chm13v2.0.fa
      type: file
      url: file:references/hs1/chm13v2.0.fa
      checksum: ''
    fai:
      path: hs1/chm13v2.0.fa.fai
      type: file
      url: file:references/hs1/chm13v2.0.fa.fai
      checksum: ''
    dict:
      path: hs1/chm13v2.0.dict
      type: file
      url: file:references/hs1/chm13v2.0.dict
      checksum: ''
  hg19:
    fasta:
      path: /Users/olwal516/ref/genomes/hg19_pickett/ref_genome.fa
      type: file
      url: ''
      checksum: ''
    fai:
      path: /Users/olwal516/ref/genomes/hg19_pickett/ref_genome.fa.fai
      type: file
      url: ''
      checksum: ''
    dict:
      path: /Users/olwal516/ref/genomes/hg19_pickett/ref_genome.dict
      type: file
      url: ''
      checksum: ''
annotations:
  vep_cache:
    path: ''
    type: optional
    url: file:references/VEP
    checksum: ''
  snpeff_db:
    path: ''
    type: optional
    url: ''
    checksum: ''
  simple_sv_panel:
    path: ''
    type: optional
    url: ''
    checksum: ''
  simple_sv_fusion_pairs:
    path: ''
    type: optional
    url: ''
    checksum: ''
