    input: "reports/bcr_abl/{sample}_{type}.phasing.json"
    output: "results/reports/bcr_abl/{sample}_{type}.phasing.json"
    when: "assay_module:bcr_abl"
  - name: BCR-ABL1 Arriba fusions TSV
    input: "reports/bcr_abl/{sample}_{type}.arriba_fusions.tsv"
    output: "results/reports/bcr_abl/{sample}_{type}.arriba_fusions.tsv"
    when: "assay_module:bcr_abl"
  - name: BCR-ABL1 exon coverage TSV
    input: "reports/bcr_abl/{sample}_{type}.exon_coverage.tsv"
    output: "results/reports/bcr_abl/{sample}_{type}.exon_coverage.tsv"
