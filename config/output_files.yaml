---
directory: "."
files:
  - name: aligned BAM
    input: null
    output: "alignment/merged/{sample}_{type}.bam"
  - name: aligned BAM index
    input: null
    output: "alignment/merged/{sample}_{type}.bam.bai"
  - name: merged FASTQ per sample
    input: null
    output: "reads/merged/{sample}_{type}.fastq.gz"
    when: merged_fastq
  - name: target region BAM (+/-25kb)
    input: null
    output: "alignment/target/{sample}_{type}.target.bam"
    when: target_metrics
  - name: target region BAM index
    input: null
    output: "alignment/target/{sample}_{type}.target.bam.bai"
    when: target_metrics
  - name: read and sequence statistics
    input: "qc/cramino/{sample}_{type}.txt"
    output: "results/qc/cramino/{sample}_{type}.txt"
  - name: on-target read and sequence statistics
    input: "qc/cramino_target/{sample}_{type}.txt"
    output: "results/qc/cramino_target/{sample}_{type}.txt"
    when: target_metrics
  - name: whole genome coverage summary
    input: "qc/mosdepth/{sample}_{type}.mosdepth.summary.txt"
    output: "results/qc/mosdepth/{sample}_{type}.mosdepth.summary.txt"
  - name: whole genome coverage regions
    input: null
    output: "qc/mosdepth/{sample}_{type}.regions.bed.gz"
  - name: whole genome coverage distribution
    input: "qc/mosdepth/{sample}_{type}.mosdepth.global.dist.txt"
    output: "results/qc/mosdepth/{sample}_{type}.mosdepth.global.dist.txt"
  - name: whole genome window distribution
    input: "qc/mosdepth/{sample}_{type}.mosdepth.region.dist.txt"
    output: "results/qc/mosdepth/{sample}_{type}.mosdepth.region.dist.txt"
  - name: target region coverage summary
    input: "qc/mosdepth_bed/{sample}_{type}.mosdepth.summary.txt"
    output: "results/qc/mosdepth_bed/{sample}_{type}.mosdepth.summary.txt"
    when: target_metrics
  - name: target region per-base coverage BED
    input: null
    output: "qc/mosdepth_bed/{sample}_{type}.per-base.bed.gz"
    when: target_metrics
  - name: target coverage distribution
    input: "qc/mosdepth_bed/{sample}_{type}.mosdepth.global.dist.txt"
    output: "results/qc/mosdepth_bed/{sample}_{type}.mosdepth.global.dist.txt"
    when: target_metrics
  - name: target region distribution
    input: "qc/mosdepth_bed/{sample}_{type}.mosdepth.region.dist.txt"
    output: "results/qc/mosdepth_bed/{sample}_{type}.mosdepth.region.dist.txt"
    when: target_metrics
  - name: Sniffles2 structural variant VCF
    input: "cnv_sv/sniffles2_call/{sample}_{type}.vcf.gz"
    output: "results/cnv_sv/sniffles2_call/{sample}_{type}.vcf.gz"
    when: sv_calling
  - name: Sniffles2 structural variant index
    input: "cnv_sv/sniffles2_call/{sample}_{type}.vcf.gz.tbi"
    output: "results/cnv_sv/sniffles2_call/{sample}_{type}.vcf.gz.tbi"
    when: sv_calling
  - name: Sniffles2 SNF evidence
    input: "cnv_sv/sniffles2_call/{sample}_{type}.snf"
    output: "results/cnv_sv/sniffles2_call/{sample}_{type}.snf"
    when: sv_calling
  - name: structural variant summary
    input: "reports/sv_summary/{sample}_{type}.tsv"
    output: "results/reports/sv_summary/{sample}_{type}.tsv"
    when: sv_calling
  - name: translocation summary
    input: "reports/sv_summary/{sample}_{type}.translocations.tsv"
    output: "results/reports/sv_summary/{sample}_{type}.translocations.tsv"
    when: sv_calling
  - name: structural variant summary JSON
    input: "reports/sv_summary/{sample}_{type}.json"
    output: "results/reports/sv_summary/{sample}_{type}.json"
    when: sv_calling
  - name: whole genome CNV summary
    input: "reports/cnv_summary/{sample}_{type}.cnv.tsv"
    output: "results/reports/cnv_summary/{sample}_{type}.cnv.tsv"
    when: cnv_calling
  - name: whole genome CNV summary JSON
    input: "reports/cnv_summary/{sample}_{type}.cnv.json"
    output: "results/reports/cnv_summary/{sample}_{type}.cnv.json"
    when: cnv_calling
  - name: CNV ideogram
    input: "reports/cnv_ideogram/{sample}_{type}.ideogram.png"
    output: "results/reports/cnv_ideogram/{sample}_{type}.ideogram.png"
    when: cnv_calling
  - name: Rindels ASCAT segments
    input: "cnv/rindels/{sample}_{type}.ascat.bed"
    output: "results/cnv/rindels/{sample}_{type}.ascat.bed"
    when: cnv_calling
  - name: Rindels CNV PDF report
    input: "cnv/rindels/{sample}_{type}_report.pdf"
    output: "results/cnv/rindels/{sample}_{type}_report.pdf"
    when: cnv_calling
  - name: Rindels structural variant summary
    input: "reports/sv_summary_rindels/{sample}_{type}.tsv"
    output: "results/reports/sv_summary_rindels/{sample}_{type}.tsv"
    when: rindels_sv
  - name: Rindels translocation table
    input: "reports/sv_summary_rindels/{sample}_{type}.translocations.tsv"
    output: "results/reports/sv_summary_rindels/{sample}_{type}.translocations.tsv"
    when: rindels_sv
  - name: Rindels variant VCF
    input: "cnv/rindels/{sample}_{type}.vcf.gz"
    output: "results/cnv/rindels/{sample}_{type}.vcf.gz"
    when: cnv_calling
  - name: Rindels variant VCF index
    input: "cnv/rindels/{sample}_{type}.vcf.gz.tbi"
    output: "results/cnv/rindels/{sample}_{type}.vcf.gz.tbi"
    when: cnv_calling
  - name: CNVkit copy ratio bins
    input: "cnv/cnvkit/{sample}_{type}.cnr"
    output: "results/cnv/cnvkit/{sample}_{type}.cnr"
    when: cnvkit_enabled
  - name: CNVkit segments
    input: "cnv/cnvkit/{sample}_{type}.cns"
    output: "results/cnv/cnvkit/{sample}_{type}.cns"
    when: cnvkit_enabled
  - name: CNV interactive HTML report
    input: "reports/cnv_html_report/{sample}_{type}.cnv_report.html"
    output: "results/reports/cnv_html_report/{sample}_{type}.cnv_report.html"
    when: cnvkit_enabled
  - name: ClairS-TO concatenated VCF
    input: "snv_indels/clairs_to/{sample}_{type}.snv-indels.vcf.gz"
    output: "results/snv_indels/clairs_to/{sample}_{type}.snv-indels.vcf.gz"
    when: clairs_to_enabled
  - name: ClairS-TO concatenated VCF index
    input: "snv_indels/clairs_to/{sample}_{type}.snv-indels.vcf.gz.tbi"
    output: "results/snv_indels/clairs_to/{sample}_{type}.snv-indels.vcf.gz.tbi"
    when: clairs_to_enabled
  - name: ClairS-TO normalized VCF
    input: "snv_indels/clairs_to_postprocess/{sample}_{type}.filtered.norm.vcf.gz"
    output: "results/snv_indels/clairs_to_postprocess/{sample}_{type}.filtered.norm.vcf.gz"
    when: clairs_to_enabled
  - name: ClairS-TO normalized VCF index
    input: "snv_indels/clairs_to_postprocess/{sample}_{type}.filtered.norm.vcf.gz.tbi"
    output: "results/snv_indels/clairs_to_postprocess/{sample}_{type}.filtered.norm.vcf.gz.tbi"
    when: clairs_to_enabled
  - name: ClairS-TO VEP annotation
    input: "snv_indels/clairs_to_postprocess/{sample}_{type}.filtered.norm.vep.vcf.gz"
    output: "results/snv_indels/clairs_to_postprocess/{sample}_{type}.filtered.norm.vep.vcf.gz"
    when: clairs_to_vep_enabled
  - name: ClairS-TO VEP annotation index
    input: "snv_indels/clairs_to_postprocess/{sample}_{type}.filtered.norm.vep.vcf.gz.tbi"
    output: "results/snv_indels/clairs_to_postprocess/{sample}_{type}.filtered.norm.vep.vcf.gz.tbi"
    when: clairs_to_vep_enabled
  - name: ClairS-TO VEP statistics
    input: "snv_indels/clairs_to_postprocess/{sample}_{type}.filtered.norm.vep.summary.html"
    output: "results/snv_indels/clairs_to_postprocess/{sample}_{type}.filtered.norm.vep.summary.html"
    when: clairs_to_vep_enabled
  - name: DeepVariant concatenated VCF
    input: "snv_indels/deepvariant/{sample}_{type}.vcf.gz"
    output: "results/snv_indels/deepvariant/{sample}_{type}.vcf.gz"
    when: deepvariant_enabled
  - name: DeepVariant concatenated VCF index
    input: "snv_indels/deepvariant/{sample}_{type}.vcf.gz.tbi"
    output: "results/snv_indels/deepvariant/{sample}_{type}.vcf.gz.tbi"
    when: deepvariant_enabled
  - name: DeepVariant normalized VCF
    input: "snv_indels/deepvariant_postprocess/{sample}_{type}.filtered.norm.vcf.gz"
    output: "results/snv_indels/deepvariant_postprocess/{sample}_{type}.filtered.norm.vcf.gz"
    when: deepvariant_enabled
  - name: DeepVariant normalized VCF index
    input: "snv_indels/deepvariant_postprocess/{sample}_{type}.filtered.norm.vcf.gz.tbi"
    output: "results/snv_indels/deepvariant_postprocess/{sample}_{type}.filtered.norm.vcf.gz.tbi"
    when: deepvariant_enabled
  - name: DeepVariant VEP annotation
    input: "snv_indels/deepvariant_postprocess/{sample}_{type}.filtered.norm.vep.vcf.gz"
    output: "results/snv_indels/deepvariant_postprocess/{sample}_{type}.filtered.norm.vep.vcf.gz"
    when: deepvariant_vep_enabled
  - name: DeepVariant VEP annotation index
    input: "snv_indels/deepvariant_postprocess/{sample}_{type}.filtered.norm.vep.vcf.gz.tbi"
    output: "results/snv_indels/deepvariant_postprocess/{sample}_{type}.filtered.norm.vep.vcf.gz.tbi"
    when: deepvariant_vep_enabled
  - name: DeepVariant VEP statistics
    input: "snv_indels/deepvariant_postprocess/{sample}_{type}.filtered.norm.vep.summary.html"
    output: "results/snv_indels/deepvariant_postprocess/{sample}_{type}.filtered.norm.vep.summary.html"
    when: deepvariant_vep_enabled
  - name: Mutect2 merged unfiltered VCF
    input: "snv_indels/bcftools_concat/{sample}_{type}.unfiltered.vcf.gz"
    output: "results/snv_indels/bcftools_concat/{sample}_{type}.unfiltered.vcf.gz"
    when: mutect2_enabled
  - name: Mutect2 merged VCF index
    input: "snv_indels/bcftools_concat/{sample}_{type}.unfiltered.vcf.gz.tbi"
    output: "results/snv_indels/bcftools_concat/{sample}_{type}.unfiltered.vcf.gz.tbi"
    when: mutect2_enabled
  - name: Mutect2 filtered VCF
    input: "snv_indels/mutect2_postprocess/{sample}_{type}.filtered.vcf.gz"
    output: "results/snv_indels/mutect2_postprocess/{sample}_{type}.filtered.vcf.gz"
    when: mutect2_enabled
  - name: Mutect2 filtered VCF index
    input: "snv_indels/mutect2_postprocess/{sample}_{type}.filtered.vcf.gz.tbi"
    output: "results/snv_indels/mutect2_postprocess/{sample}_{type}.filtered.vcf.gz.tbi"
    when: mutect2_enabled
  - name: Mutect2 filtering statistics
    input: "snv_indels/mutect2_postprocess/{sample}_{type}.filteringStats.tsv"
    output: "results/snv_indels/mutect2_postprocess/{sample}_{type}.filteringStats.tsv"
    when: mutect2_enabled
  - name: Mutect2 normalized filtered VCF
    input: "snv_indels/mutect2_postprocess/{sample}_{type}.filtered.norm.vcf.gz"
    output: "results/snv_indels/mutect2_postprocess/{sample}_{type}.filtered.norm.vcf.gz"
    when: mutect2_enabled
  - name: Mutect2 normalized filtered VCF index
    input: "snv_indels/mutect2_postprocess/{sample}_{type}.filtered.norm.vcf.gz.tbi"
    output: "results/snv_indels/mutect2_postprocess/{sample}_{type}.filtered.norm.vcf.gz.tbi"
    when: mutect2_enabled
  - name: Mutect2 VEP annotation
    input: "snv_indels/mutect2_postprocess/{sample}_{type}.filtered.norm.vep.vcf.gz"
    output: "results/snv_indels/mutect2_postprocess/{sample}_{type}.filtered.norm.vep.vcf.gz"
    when: mutect2_vep_enabled
  - name: Mutect2 VEP annotation index
    input: "snv_indels/mutect2_postprocess/{sample}_{type}.filtered.norm.vep.vcf.gz.tbi"
    output: "results/snv_indels/mutect2_postprocess/{sample}_{type}.filtered.norm.vep.vcf.gz.tbi"
    when: mutect2_vep_enabled
  - name: Mutect2 VEP statistics
    input: "snv_indels/mutect2_postprocess/{sample}_{type}.filtered.norm.vep.summary.html"
    output: "results/snv_indels/mutect2_postprocess/{sample}_{type}.filtered.norm.vep.summary.html"
    when: mutect2_vep_enabled
  - name: Mutect2 SnpEff annotation
    input: "snv_indels/mutect2_postprocess/{sample}_{type}.filtered.norm.snpeff_annotated.vcf.gz"
    output: "results/snv_indels/mutect2_postprocess/{sample}_{type}.filtered.norm.snpeff_annotated.vcf.gz"
    when: annotate_small_variants
  - name: Mutect2 SnpEff statistics
    input: "snv_indels/mutect2_postprocess/{sample}_{type}.filtered.norm.snpeff.csv"
    output: "results/snv_indels/mutect2_postprocess/{sample}_{type}.filtered.norm.snpeff.csv"
    when: annotate_small_variants
  - name: Sniffles2 SnpEff annotation
    input: "cnv_sv/sniffles2_call/{sample}_{type}.snpeff_annotated.vcf.gz"
    output: "results/cnv_sv/sniffles2_call/{sample}_{type}.snpeff_annotated.vcf.gz"
    when: annotate_svs
  - name: Sniffles2 simple SV annotation
    input: "cnv_sv/sniffles2_call/{sample}_{type}.snpeff_annotated.ss_annotated.vcf"
    output: "results/cnv_sv/sniffles2_call/{sample}_{type}.snpeff_annotated.ss_annotated.vcf"
    when: annotate_svs
  - name: BCR-ABL1 fusion summary TSV
    input: "reports/bcr_abl/{sample}_{type}.fusion_summary.tsv"
    output: "results/reports/bcr_abl/{sample}_{type}.fusion_summary.tsv"
