  - name: BCR-ABL1 fusion summary JSON
    input: "reports/bcr_abl/{sample}_{type}.fusion_summary.json"
    output: "results/reports/bcr_abl/{sample}_{type}.fusion_summary.json"
    when: "assay_module:bcr_abl"
  - name: BCR-ABL1 all Branford sites TSV
