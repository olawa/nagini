    <rect x="237.6" y="440" width="2.4" height="30" fill="#eb6834" rx="1"/>
    <rect x="257.0" y="451" width="2.4" height="19" fill="#8a8982" rx="1"/>
    <rect x="260.3" y="440" width="2.4" height="30" fill="#eb6834" rx="1"/>
    <rect x="299.2" y="440" width="2.4" height="30" fill="#eb6834" rx="1"/>
    <rect x="311.6" y="440" width="3.6" height="30" fill="#e34948" rx="1"/>
    <rect x="318.7" y="440" width="2.4" height="30" fill="#eb6834" rx="1"/>
