    <line x1="427.0" y1="476" x2="427.0" y2="482" stroke="#c9c8c0" stroke-width="2"/>
    <text x="427.0" y="500" class="ax" text-anchor="middle">350</text>
    <line x1="589.2" y1="476" x2="589.2" y2="482" stroke="#c9c8c0" stroke-width="2"/>
    <text x="589.2" y="500" class="ax" text-anchor="middle">400</text>
    <line x1="751.5" y1="476" x2="751.5" y2="482" stroke="#c9c8c0" stroke-width="2"/>
    <text x="751.5" y="500" class="ax" text-anchor="middle">450</text>
    <line x1="913.8" y1="476" x2="913.8" y2="482" stroke="#c9c8c0" stroke-width="2"/>
    <text x="913.8" y="500" class="ax" text-anchor="middle">500</text>
  <text x="70" y="522" class="mono">codon 244</text>
  <text x="930" y="522" class="mono" text-anchor="end">codon 499</text>

  <!-- T315I called out below the axis, clear of every tick -->
  <path d="M313.4,476 L313.4,532" stroke="#e34948" stroke-width="2"/>
  <circle cx="313.4" cy="532" r="3.5" fill="#e34948"/>
  <text x="325.4" y="528" class="ttl" fill="#e34948">T315I</text>
  <text x="325.4" y="546" class="sub">gatekeeper — defeats every TKI except ponatinib and asciminib</text>

  <g transform="translate(70,588)">
    <rect x="0" y="-13" width="2.4" height="19" fill="#8a8982" rx="1"/>
    <text x="14" y="3" class="sub">one alternate</text>
    <rect x="120" y="-24" width="2.4" height="30" fill="#eb6834" rx="1"/>
    <text x="134" y="3" class="sub">several alternates at one codon (20 codons)</text>
  </g>

  <!-- ===== 3. phasing ===== -->
  <line x1="40" y1="618" x2="960" y2="618" stroke="#e4e3dc" stroke-width="2"/>
  <text x="40" y="650" class="hdr">3 — AND IF TWO ARE FOUND: SAME MOLECULE?</text>
  <text x="40" y="672" class="sub">One read spans the whole domain (~1 kb) —</text>
  <text x="40" y="690" class="sub">the question is settled without statistical phasing.</text>

  <g transform="translate(450,646)">
    <text x="0" y="5" class="ttl" fill="#1baf7a">CIS</text>
    <line x1="48" y1="0" x2="216" y2="0" stroke="#1baf7a" stroke-width="3.5"/>
    <circle cx="104" cy="0" r="5.5" fill="#1baf7a"/><circle cx="168" cy="0" r="5.5" fill="#1baf7a"/>
    <text x="232" y="5" class="sub">both on one read — compound mutation</text>
  </g>
  <g transform="translate(450,682)">
    <text x="0" y="11" class="ttl">TRANS</text>
    <line x1="48" y1="0" x2="216" y2="0" stroke="#8a8982" stroke-width="3.5"/>
    <circle cx="104" cy="0" r="5.5" fill="#8a8982"/>
    <line x1="48" y1="20" x2="216" y2="20" stroke="#8a8982" stroke-width="3.5"/>
    <circle cx="168" cy="20" r="5.5" fill="#8a8982"/>
    <text x="232" y="11" class="sub">separate reads — two independent clones</text>
  </g>
</svg>
