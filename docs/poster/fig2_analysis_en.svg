    <rect x="909.3" y="451" width="2.4" height="19" fill="#8a8982" rx="1"/>
  <line x1="102.5" y1="476" x2="102.5" y2="482" stroke="#c9c8c0" stroke-width="2"/>
    <text x="102.5" y="500" class="ax" text-anchor="middle">250</text>
    <line x1="264.7" y1="476" x2="264.7" y2="482" stroke="#c9c8c0" stroke-width="2"/>
