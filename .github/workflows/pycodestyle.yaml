name: pycodestyle

# Controls when the action will run.
on:
   # Triggers the workflow on push or pull request events but only for the master and develop branch
  push:
    branches:
     - develop
     - main
  pull_request:
    branches:
     - develop
     - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  pycodestyle:
    name: pycodestyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Snakemake 7.32.4 mangles f-strings in .smk files on Python 3.12+, and
      # workflow/rules/common.smk refuses to start there. Stay on 3.11.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.test.txt
      - name: Install requirements.txt and requirements.test.txt
        run: |
          pip install -r requirements.txt -r requirements.test.txt
      - name: Check python syntax lib
        run: pycodestyle --max-line-length=130 --statistics workflow/scripts
