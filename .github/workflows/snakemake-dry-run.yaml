name: Snakemake dry run

# Controls when the action will run.
on:
   # Triggers the workflow on push or pull request events but only for the master and develop branch
  push:
    branches:
     - develop
     - main
  pull_request:
    branches:
     - develop
     - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  snakemake-dry-run:
    name: Run snakemake dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Snakemake 7.32.4 mangles f-strings in .smk files on Python 3.12+, and
      # workflow/rules/common.smk refuses to start there. Stay on 3.11.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.test.txt
      - name: Install requirements.txt
        run: |
          pip install -r requirements.txt
      # The Hydra modules and Snakemake wrappers are read from vendor/, which
      # is not in git. Fetching them is the one step that needs the network.
      - name: Cache vendor/
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('build/vendor_hydra_dependencies.sh') }}
      - name: Vendor Hydra modules and wrappers
        run: |
          # Back-to-back shallow fetches race git's background maintenance
          # ("shallow file has changed since we read it").
          git config --global maintenance.auto false
          git config --global gc.auto 0
          bash build/vendor_hydra_dependencies.sh
      - name: snakemake dry run
        run: |
          snakemake -n -s workflow/Snakefile --configfiles config/config.yaml .tests/integration/config/config.yaml
          snakemake -n -s workflow/Snakefile --configfiles config/config.yaml .tests/integration/config/config.yaml .tests/integration/config/config_minknow.yaml
          snakemake -n -s workflow/Snakefile --configfiles config/config.yaml .tests/integration/config/config.yaml .tests/integration/config/config_minknow.yaml .tests/integration/config/config_both_outputs.yaml
          snakemake -n -s workflow/Snakefile --configfiles config/config.yaml .tests/integration/config/config.yaml .tests/integration/config/config_minknow.yaml .tests/integration/config/config_dorado_aligner.yaml
