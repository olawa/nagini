$schema: "http://json-schema.org/draft-07/schema#"
description: One Nanopore input unit per row.
type: object
properties:
  sample:
    type: string
  type:
    type: string
    pattern: "^(N|T|R)$"
  platform:
    type: string
    enum: [ONT, ont]
  processing_unit:
    type: string
    pattern: "^[A-Za-z0-9_.-]+$"
  barcode:
    type: string
    pattern: "^[A-Za-z0-9+_.-]+$"
  input_type:
    type: string
    enum: [fastq, unmapped_bam, aligned_bam]
  fastq1:
    type: string
  fastq2:
    type: string
  bam:
    type: string
  methylation:
    type: string
    enum: ["Yes", "No", "yes", "no", "NA", ""]
  run_id:
    type: string
  basecalling_model:
    type: string
  machine:
    type: string
  flowcell:
    type: string
  lane:
    type: string
required:
  - sample
  - type
  - platform
  - processing_unit
  - barcode
  - input_type
  - fastq1
  - fastq2
  - bam
  - methylation
  - run_id
  - basecalling_model
allOf:
  - if:
      properties:
        input_type:
          const: fastq
    then:
      required: [fastq1]
  - if:
      properties:
        input_type:
          enum: [unmapped_bam, aligned_bam]
    then:
      required: [bam]
