$schema: "http://json-schema.org/draft-07/schema#"
description: One Nanopore input unit per row.
type: object
properties:
  sample:
    type: string
  type:
    type: string
    pattern: "^(N|T|R)$"
  platform:
    type: string
    enum: [ONT, ont]
  processing_unit:
    type: string
    pattern: "^[A-Za-z0-9_.-]+$"
  barcode:
    type: string
    pattern: "^[A-Za-z0-9+_.-]+$"
  barcode_name:
    type: string
    pattern: "^(barcode[0-9]+)?$"
  input_type:
    type: string
    enum: [fastq, unmapped_bam, aligned_bam, dorado_bam]
  fastq1:
    type: string
  fastq2:
    type: string
  bam:
    type: string
  methylation:
    type: string
    enum: ["Yes", "No", "yes", "no", "NA", ""]
  run_id:
    type: string
  basecalling_model:
    type: string
  machine:
    type: string
  flowcell:
    type: string
  lane:
    type: string
  library_type:
    type: string
    enum: ["wgs", "cdna", "direct_rna", ""]
  assay:
    description: >
      What the sample was sequenced for. Decides which analysis runs, while
      library_type decides how the reads are aligned. Values are validated
      against the assay registry in the config, not here, so that a site can
      declare a new assay without editing this schema.
    type: string
required:
  - sample
  - type
  - platform
  - processing_unit
  - barcode
  - input_type
  - fastq1
  - fastq2
  - bam
  - methylation
  - run_id
  - basecalling_model
allOf:
  - if:
      properties:
        input_type:
          const: fastq
    then:
      required: [fastq1]
  - if:
      properties:
        input_type:
          enum: [unmapped_bam, aligned_bam, dorado_bam]
    then:
      required: [bam]
  - if:
      properties:
        input_type:
          const: dorado_bam
    then:
      required: [barcode_name]
