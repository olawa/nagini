$schema: "http://json-schema.org/draft-07/schema#"
description: Configuration for the nagini Nanopore pipeline
type: object
properties:
  site:
    type: string
    description: Runtime site selected by the launcher, for example local or marvin.
  hydra_local_path:
    type: string
    description: Local root containing hydra-genetics/<module> checkouts for offline execution.
  samples:
    type: string
  units:
    type: string
  output:
    type: string
    description: YAML/JSON output specification.
  resources:
    type: string
    description: Resource configuration file.
  default_container:
    type: string
    description: Default Docker/Singularity/Apptainer image.
  container_cache:
    type: string
    description: Optional site-specific container cache or image directory.
  container_runtime:
    type: string
    description: Container runtime recorded by the selected site config.
  singularity_binds:
    type: array
    items:
      type: string
    description: Site paths that must be visible inside Singularity/Apptainer.
  site_config_path:
    type: string
  reference_files_path:
    type: string
  library_root:
    type: string
  reference_build:
    type: string
    enum: [hg38, hs1]
  references:
    type: object
    description: Reference paths keyed by reference_build.
    properties:
      hg38:
        $ref: "#/definitions/reference"
      hs1:
        $ref: "#/definitions/reference"
    required: [hg38, hs1]
  modules:
    type: object
    description: Pinned Hydra-Genetics module tags.
    additionalProperties:
      type: string
  annotate_small_variants:
    type: boolean
    description: Enable the legacy SnpEff small-variant branch.
  annotate_small_variants_with_vep:
    type: boolean
    description: Annotate normalized filtered small variants with an offline VEP cache.
  annotate_svs:
    type: boolean
  gatk_merge_mutect_stats:
    $ref: "#/definitions/tool_config"
  gatk_filter_mutect_calls:
    $ref: "#/definitions/tool_config"
  bcftools_norm_mutect2:
    $ref: "#/definitions/tool_config"
  nagini_excel_report:
    $ref: "#/definitions/tool_config"
  vep:
    type: object
    properties:
      container:
        type: string
      vep_cache:
        type: string
      skip:
        type: boolean
      mode:
        type: string
      extra:
        type: string
      benchmark_repeats:
        type: integer
        minimum: 1
    additionalProperties: true
  minimap2_align:
    type: object
    properties:
      preset:
        type: string
      extra:
        type: string
      read_group:
        type: string
  dorado:
    type: object
    properties:
      container:
        type: [string, "null"]
      binary:
        type: string
      input:
        type: string
      model:
        type: string
      kit:
        type: string
      device:
        type: string
      models_directory:
        type: string
      basecaller_extra:
        type: string
      demux_extra:
        type: string
      demux_output_format:
        type: string
        enum: [bam, fastq, both]
      allow_empty_barcodes:
        type: boolean
      benchmark_repeats:
        type: integer
        minimum: 1
    additionalProperties: true
  dorado_alignment:
    type: object
    properties:
      aligner:
        type: string
        enum: [minimap2, dorado]
      container:
        type: string
      extra:
        type: string
      benchmark_repeats:
        type: integer
        minimum: 1
    additionalProperties: true
  output_directory:
    type: string
  multiqc:
    type: object
  reference:
    type: object
  resources_config:
    type: object
  default_resources:
    type: object
additionalProperties: true
definitions:
  tool_config:
    type: object
    properties:
      container:
        type: string
      extra:
        type: string
      benchmark_repeats:
        type: integer
        minimum: 1
    additionalProperties: true
  reference:
    type: object
    properties:
      fasta:
        type: string
      fai:
        type: string
      dict:
        type: string
      mmi:
        type: string
      design_bed:
        type: string
      sv_annotation_bed:
        type: string
      tandem_repeats:
        type: string
        description: Optional tandem-repeat BED passed to Sniffles2.
      clinvar:
        type: string
        description: Optional bgzipped, tabix-indexed ClinVar VCF for VEP custom annotation.
      cytoband:
        type: string
        description: Optional UCSC cytoBand.txt or cytoBand.txt.gz file.
      gene_annotation:
        type: string
        description: Optional GTF retained as reference provenance.
      annotations:
        type: string
        description: Optional site-specific annotation manifest.
      chromosomes:
        type: array
        items:
          type: string
      skip_chrs:
        type: array
        items:
          type: string
    required: [fasta, fai, dict, design_bed, chromosomes]


required:
  - samples
  - units
  - output
  - resources
  - default_container
  - reference_build
  - references
  - modules
