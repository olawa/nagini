$schema: http://json-schema.org/draft-07/schema#
description: Configuration for the nagini Nanopore pipeline
type: object
properties:
  _copy:
    type: object
    description: settings for _copy
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra command-line arguments
  annotate_small_variants:
    type: boolean
    description: Enable the legacy SnpEff small-variant branch.
  annotate_small_variants_with_vep:
    type: boolean
    description: Annotate normalized filtered small variants with an offline VEP cache.
  annotate_svs:
    type: boolean
  arriba:
    type: object
    description: settings for arriba
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra command-line arguments
      protein_domains:
        type: string
        description: 'protein domains (default: '''')'
  assays:
    description: 'Assay registry, merged over the built-in definitions in workflow/scripts/nagini_routing.py.
      Each entry decides what analysis runs for samples carrying that assay in units.tsv.

      '
    type: object
    additionalProperties:
      type: object
      properties:
        description:
          type: string
        library_type:
          type: string
          enum:
          - wgs
          - cdna
          - direct_rna
        snv_calling:
          type: boolean
        sv_calling:
          type: boolean
        target_restricted:
          type: boolean
        modules:
          type: array
          items:
            type: string
        config_overrides:
          description: 'Tool settings that differ for this assay, as {section: {key: value}}. Applied
            on top of the corresponding top-level config section for samples carrying this assay.

            '
          type: object
          additionalProperties:
            type: object
      additionalProperties: false
  bcftools:
    type: object
    description: settings for bcftools
    properties:
      container:
        type: string
        description: name or path to docker/singularity container
  bcftools_concat:
    type: object
    description: settings for bcftools_concat
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      extra:
        type: string
        description: extra command-line arguments
  bcftools_norm_clairs_to:
    type: object
    description: settings for bcftools_norm_clairs_to
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra command-line arguments
  bcftools_norm_deepvariant:
    type: object
    description: settings for bcftools_norm_deepvariant
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra command-line arguments
  bcftools_norm_mutect2:
    $ref: '#/definitions/tool_config'
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra command-line arguments
  bcr_abl:
    type: object
    description: settings for bcr_abl
    properties:
      bcftools_mpileup_extra:
        type: string
        description: 'bcftools mpileup extra (default: '''')'
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      branford_bed:
        type: string
        description: 'branford bed (default: '''')'
      branford_caller_extra:
        type: string
        description: 'branford caller extra (default: '''')'
      container:
        type: string
        description: name or path to docker/singularity container
      enable_bcftools_pileup:
        type: boolean
        description: 'enable bcftools pileup (default: False)'
      enable_rindels:
        type: boolean
        description: 'enable rindels (default: False)'
      exons_bed:
        type: string
        description: 'exons bed (default: '''')'
      features_json:
        type: string
        description: 'features json (default: '''')'
      gtf:
        type: string
        description: 'gtf (default: '''')'
      kmer_window:
        type: integer
        description: 'kmer window (default: 3)'
      known_variants:
        description: known variants
      max_depth:
        type: integer
        description: 'max depth (default: 1000000)'
      max_sor:
        type: number
        description: 'max sor (default: 3.0)'
      min_af:
        type: number
        description: 'min af (default: 0.01)'
      min_alt_reads:
        type: integer
        description: 'min alt reads (default: 5)'
      min_base_quality:
        type: integer
        description: 'min base quality (default: 12)'
      min_depth:
        type: integer
        description: 'min depth (default: 50)'
      min_kmer_rate:
        type: number
        description: 'min kmer rate (default: 0.6)'
      min_mapq:
        type: integer
        description: 'min mapq (default: 1)'
      min_mean_baseq:
        type: number
        description: 'min mean baseq (default: 14.0)'
      min_minor_strand_ratio:
        type: number
        description: 'min minor strand ratio (default: 0.05)'
      min_snr:
        type: number
        description: 'min snr (default: 3.0)'
      min_spanning_reads:
        type: integer
        description: 'min spanning reads (default: 10)'
      pileup_prior:
        type: number
        description: 'pileup prior (default: 0.01)'
      rindels_binary:
        type: string
        description: 'rindels binary (default: '''')'
      subclonal_af:
        type: number
        description: 'subclonal af (default: 0.002)'
      tolerance:
        type: integer
        description: 'tolerance (default: 150)'
  bcr_abl_rindels:
    type: object
    description: settings for bcr_abl_rindels
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
  bgzip:
    type: object
    description: settings for bgzip
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
  clairs_to_call:
    type: object
    description: settings for clairs_to_call
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      default_platform:
        type: string
        description: 'default platform (default: '''')'
      indel_min_af:
        type: number
        description: 'indel min af (default: 0.1)'
      platform:
        type: string
        description: 'platform (default: '''')'
      platform_map:
        type: object
        description: platform map
      snv_min_af:
        type: number
        description: 'snv min af (default: 0.05)'
  clairs_to_concat:
    type: object
    description: settings for clairs_to_concat
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
  cnv_html_report:
    type: object
    description: settings for cnv_html_report
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
      cytobands:
        type: boolean
        description: 'cytobands (default: False)'
      extra_tables:
        type: array
        description: extra tables
      show_table:
        type: boolean
        description: 'show table (default: False)'
      wide_plot_width:
        type:
        - integer
        - boolean
        description: width of the wide plot in pixels, or false for the default
  cnv_json:
    type: object
    description: settings for cnv_json
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
      csv_field_size_limit:
        type: integer
        description: 'csv field size limit (default: 100000000)'
  cnv_rindels:
    type: object
    description: settings for cnv_rindels
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
  cnv_summary:
    type: object
    description: settings for cnv_summary
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra command-line arguments
  cnvkit_batch:
    type: object
    description: settings for cnvkit_batch
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra command-line arguments
      method:
        type: string
        description: 'method (default: ''wgs'')'
      target_avg_size:
        type: integer
        description: 'target avg size (default: 50000)'
  container_cache:
    type: string
    description: Optional site-specific container cache or image directory.
  container_runtime:
    type: string
    description: Container runtime recorded by the selected site config.
  cramino:
    type: object
    description: settings for cramino
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
  create_genome_contigs_bed:
    type: object
    description: settings for create_genome_contigs_bed
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
  cytoband_centromeres:
    type: object
    description: settings for cytoband_centromeres
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
  decompress_cytoband:
    type: object
    description: settings for decompress_cytoband
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra command-line arguments
  deepvariant:
    type: object
    description: settings for deepvariant
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      extra:
        type: string
        description: extra command-line arguments
      model_type:
        type: string
        description: 'model type (default: ''ONT_R104'')'
  default_container:
    type: string
    description: Default Docker/Singularity/Apptainer image.
  default_resources:
    type: object
  dorado:
    type: object
    properties:
      container:
        type:
        - string
        - 'null'
      binary:
        type: string
      input:
        type: string
      model:
        type: string
      kit:
        type: string
      device:
        type: string
      models_directory:
        type: string
      basecaller_extra:
        type: string
      demux_extra:
        type: string
      demux_output_format:
        type: string
        enum:
        - bam
        - fastq
        - both
      allow_empty_barcodes:
        type: boolean
      benchmark_repeats:
        type: integer
        minimum: 1
    additionalProperties: true
  dorado_alignment:
    type: object
    properties:
      aligner:
        type: string
        enum:
        - minimap2
        - dorado
      container:
        type: string
      extra:
        type: string
      benchmark_repeats:
        type: integer
        minimum: 1
    additionalProperties: true
  dorado_demux_bam:
    type: object
    description: settings for dorado_demux_bam
    properties:
      container:
        type: string
        description: name or path to docker/singularity container
  dorado_demux_qc:
    type: object
    description: settings for dorado_demux_qc
    properties:
      container:
        type: string
        description: name or path to docker/singularity container
  dorado_demux_summary:
    type: object
    description: settings for dorado_demux_summary
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
  dorado_fastq:
    type: object
    description: settings for dorado_fastq
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
  extract_target_bam:
    type: object
    description: settings for extract_target_bam
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra command-line arguments
  finalize_dorado_alignment:
    type: object
    description: settings for finalize_dorado_alignment
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra command-line arguments
  gatk_filter_mutect_calls:
    $ref: '#/definitions/tool_config'
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
  gatk_merge_mutect_stats:
    $ref: '#/definitions/tool_config'
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra command-line arguments
  hydra_local_path:
    type: string
    description: Local root containing hydra-genetics/<module> checkouts for offline execution.
  library_root:
    type: string
  merge_cnv_json:
    type: object
    description: settings for merge_cnv_json
    properties:
      annotations:
        type: array
        description: annotations
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      cancer_genes:
        type: array
        description: cancer genes
      container:
        type: string
        description: name or path to docker/singularity container
      ref_genes:
        type: array
        description: ref genes
  merged_fastq:
    type: boolean
    description: 'Write one FASTQ per sample, merged across flowcells, to reads/nagini_fastq/. Unaligned
      BAM input only.

      '
  minimap2_align:
    type: object
    properties:
      preset:
        type: string
      extra:
        type: string
      read_group:
        type: string
      index_preset:
        description: index preset
  minimap2_fastq_align:
    type: object
    description: settings for minimap2_fastq_align
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
  minimap2_unmapped_bam_align:
    type: object
    description: settings for minimap2_unmapped_bam_align
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
  modules:
    type: object
    description: Pinned Hydra-Genetics module tags.
    additionalProperties:
      type: string
  mosdepth:
    type: object
    description: settings for mosdepth
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      by:
        type:
        - integer
        - string
        description: 'window size for the whole-genome coverage (default: 1000)'
      extra:
        type: string
        description: extra command-line arguments
  mosdepth_bed:
    type: object
    description: settings for mosdepth_bed
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      extra:
        type: string
        description: extra command-line arguments
  multiqc:
    type: object
    properties:
      reports:
        type: object
        description: reports
  nagini_excel_report:
    $ref: '#/definitions/tool_config'
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
  output:
    type: string
    description: YAML/JSON output specification.
  output_directory:
    type: string
  pad_target_bed:
    type: object
    description: settings for pad_target_bed
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
  read_filter:
    type: object
    description: settings for read_filter
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      binary:
        type: string
        description: 'binary (default: '''')'
      container:
        type: string
        description: name or path to docker/singularity container
      enabled:
        type: boolean
        description: 'enabled (default: False)'
      extra:
        type: string
        description: extra command-line arguments
      length_range:
        type: string
        description: 'length range (default: ''500-3000'')'
      min_qv:
        type: integer
        description: 'min qv (default: 20)'
  reference:
    type: object
  reference_build:
    description: 'Which entry of `references` to use. Validated against the keys actually present there
      rather than a fixed list, so a site can add a build (hg19 for the BCR-ABL1 panel, for instance)
      without editing this schema.

      '
    type: string
    minLength: 1
  reference_files_path:
    type: string
  references:
    type: object
    description: Reference paths keyed by reference_build.
    minProperties: 1
    additionalProperties:
      $ref: '#/definitions/reference'
  resources:
    type: string
    description: Resource configuration file.
  resources_config:
    type: object
  rindels:
    type: object
    description: settings for rindels
    properties:
      binary:
        type: string
        description: 'binary (default: '''')'
      cnv_bin_size:
        type: integer
        description: 'cnv bin size (default: 50000)'
      extra:
        type: string
        description: extra command-line arguments
      extra_cnv:
        type: string
        description: 'extra cnv (default: ''--ont --sv-lite'')'
      report:
        type: boolean
        description: 'report (default: True)'
  rindels_ideogram:
    type: object
    description: settings for rindels_ideogram
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      extra:
        type: string
        description: extra command-line arguments
      height:
        type: integer
        description: 'height (default: 2400)'
      width:
        type: integer
        description: 'width (default: 2000)'
  samples:
    type: string
  samtools_fastq:
    type: object
    description: settings for samtools_fastq
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra command-line arguments
  samtools_index:
    type: object
    description: settings for samtools_index
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
  samtools_merge_bam:
    type: object
    description: settings for samtools_merge_bam
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra command-line arguments
  savana_ont_to:
    type: object
    description: settings for savana_ont_to
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      extra:
        type: string
        description: extra command-line arguments
      genome_version:
        type: string
        description: 'genome version (default: '''')'
  simple_sv_annotation:
    type: object
    description: settings for simple_sv_annotation
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      fusion_pairs:
        type: string
        description: 'fusion pairs (default: '''')'
      panel:
        type: string
        description: 'panel (default: '''')'
  singularity_binds:
    type: array
    items:
      type: string
    description: Site paths that must be visible inside Singularity/Apptainer.
  site:
    type: string
    description: Runtime site selected by the launcher, for example local or marvin.
  site_config_path:
    type: string
  snpeff:
    type: object
    description: settings for snpeff
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      db:
        type: string
        description: 'db (default: '''')'
  stage_aligned_bam:
    type: object
    description: settings for stage_aligned_bam
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra command-line arguments
  sv_summary:
    type: object
    description: settings for sv_summary
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra command-line arguments
  tabix:
    type: object
    description: settings for tabix
    properties:
      benchmark_repeats:
        type: integer
        description: number of times the benchmark should be repeated
  target_bam:
    type: object
    description: settings for target_bam
    properties:
      padding_bp:
        type: integer
        description: 'padding bp (default: 25000)'
  units:
    type: string
  vep:
    type: object
    properties:
      container:
        type: string
      vep_cache:
        type: string
      skip:
        type: boolean
      mode:
        type: string
      extra:
        type: string
      benchmark_repeats:
        type: integer
        minimum: 1
    additionalProperties: true
additionalProperties: true
definitions:
  tool_config:
    type: object
    properties:
      container:
        type: string
      extra:
        type: string
      benchmark_repeats:
        type: integer
        minimum: 1
    additionalProperties: true
  reference:
    type: object
    properties:
      fasta:
        type: string
      fai:
        type: string
      dict:
        type: string
      mmi:
        type: string
      design_bed:
        type: string
      sv_annotation_bed:
        type: string
      tandem_repeats:
        type: string
        description: Optional tandem-repeat BED passed to Sniffles2.
      clinvar:
        type: string
        description: Optional bgzipped, tabix-indexed ClinVar VCF for VEP custom annotation.
      cytoband:
        type: string
        description: Optional UCSC cytoBand.txt or cytoBand.txt.gz file.
      gene_annotation:
        type: string
        description: Optional GTF retained as reference provenance.
      annotations:
        type: string
        description: Optional site-specific annotation manifest.
      chromosomes:
        type: array
        items:
          type: string
      skip_chrs:
        type: array
        items:
          type: string
    required:
    - fasta
    - fai
    - dict
    - design_bed
    - chromosomes
required:
- samples
- units
- output
- resources
- default_container
- reference_build
- references
- modules
