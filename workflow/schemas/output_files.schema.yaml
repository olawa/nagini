$schema: "http://json-schema.org/draft-07/schema#"
description: Output file specification for nagini.
type: object
properties:
  directory:
    type: string
  files:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        input:
          type:
            - string
            - "null"
        output:
          type: string
          description: >-
            Path of the deliverable. {sample} and {type} expand per sample and
            unit type, {barcode} per Dorado barcode.
        types:
          type: array
          items:
            type: string
            pattern: "^(N|T|R)$"
        when:
          type: string
          description: Boolean config key that enables this output.
      required: [name, input, output]
required: [files]
