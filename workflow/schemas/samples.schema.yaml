$schema: "http://json-schema.org/draft-04/schema#"
description: sample list
properties:
  sample:
    type: string
    description: sample id
  tumor_content:
    type: string
    description: tumor cell content in sample
  dna_number:
    type: string
    description: >
      Lab identifier for the sample, shown in the reports. Kept apart from
      `sample`, which names files and so has to stay filename-safe and stable.
required:
  - sample
